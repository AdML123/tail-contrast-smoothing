[project]
name = "hbpc-experiments"
version = "0.1.0"
description = "Lightweight HBPC time-series anomaly detection experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "huggingface_hub>=0.36",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pypdf>=4,<7"]
public = [
  "einops==0.8.1",
  "local-attention==1.11.2",
  "reformer-pytorch==1.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests/release_smoke"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["hbpc*"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
